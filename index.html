<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student CRM - Xayyam</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Student CRM System</h1>
            <p>Manage Your Students Efficiently</p>
        </header>

        <div class="form-section">
            <h2>Add New Student</h2>
            <form id="studentForm">
                <div class="form-group">
                    <label for="studentName">Full Name</label>
                    <input type="text" id="studentName" name="studentName" required placeholder="Enter student's full name">
                </div>

                <div class="form-group">
                    <label for="studentEmail">Email Address</label>
                    <input type="email" id="studentEmail" name="studentEmail" required placeholder="student@example.com">
                </div>

                <div class="form-group">
                    <label for="studentPhone">Phone Number</label>
                    <input type="tel" id="studentPhone" name="studentPhone" required placeholder="+1234567890">
                </div>

                <div class="form-group">
                    <label for="studentCourse">Course</label>
                    <select id="studentCourse" name="studentCourse" required>
                        <option value="">Select a course</option>
                        <option value="Computer Science">Computer Science</option>
                        <option value="Business Administration">Business Administration</option>
                        <option value="Engineering">Engineering</option>
                        <option value="Mathematics">Mathematics</option>
                        <option value="Arts">Arts</option>
                    </select>
                </div>

                <button type="submit" class="btn">Add Student</button>
            </form>
        </div>

        <div class="students-list">
            <h2>Students List</h2>
            <div id="studentsList">
                <div class="empty-state">
                    <p>No students added yet. Start by adding your first student!</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
